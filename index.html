<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINPAY - Verificador de Comprovativos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f0f3f6;
            --text-color: #2c3e50;
            --error-color: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: var(--primary-color);
            animation: fadeIn 1s ease-out;
        }

        #uploadForm {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #fileInput {
            display: none;
        }

        .file-label {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            display: inline-block;
        }

        .file-label:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            width: 100%;
            max-width: 200px;
        }

        button:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f8f9fa;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .valid {
            color: var(--secondary-color);
        }

        .invalid {
            color: var(--error-color);
        }

        .icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FINPAY - Verificador de Comprovativos</h1>
        <form id="uploadForm">
            <label for="fileInput" class="file-label">
                <i class="fas fa-file-upload"></i> Escolher Arquivo
            </label>
            <input type="file" id="fileInput" required>
            <button type="submit"><i class="fas fa-check"></i> Verificar</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            const submitButton = document.querySelector('button[type="submit"]');

            if (fileInput.files.length === 0) {
                resultDiv.textContent = 'Por favor, selecione um arquivo.';
                resultDiv.className = 'show';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                resultDiv.innerHTML = '<div class="loading"></div> Enviando e verificando o arquivo...';
                resultDiv.className = 'show';
                submitButton.disabled = true;
                submitButton.innerHTML = '<div class="loading"></div> Processando...';

                const response = await axios.post('https://verifica-jet.vercel.app/upload', formData, {
                    headers: {
                        'Content-Type': 'multipart/form-data'
                    }
                });

                const isValid = response.data.original;

                const icon = isValid ? '<i class="fas fa-check-circle icon"></i>' : '<i class="fas fa-times-circle icon"></i>';
                const status = isValid ? 'Comprovativo Válido' : 'Comprovativo Falso';
                const statusClass = isValid ? 'valid' : 'invalid';

                resultDiv.innerHTML = `
                    <h2 class="${statusClass}">${icon}${status}</h2>
                `;

            } catch (error) {
                resultDiv.innerHTML = `<h2 class="invalid"><i class="fas fa-exclamation-triangle icon"></i>Erro</h2>
                    <pre>${error.response ? error.response.data.error : error.message}</pre>`;
            } finally {
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-check"></i> Verificar';
            }
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const fileName = e.target.files[0]?.name || 'Nenhum arquivo selecionado';
            document.querySelector('.file-label').textContent = fileName;
        });
    </script>
</body>
</html>
